<title>Ura: Studim Bible</title>
<style>
:root{--bg:#f6f8fb;--fg:#1c2430;--mut:#5b6675;--card:#fff;--line:#dde3ec;--ac:#1e3a6e;--on:#fff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1520;--fg:#e8edf5;--mut:#9aa7ba;--card:#172033;--line:#26324a;--ac:#8fb0ff;--on:#0f1520;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1520;--fg:#e8edf5;--mut:#9aa7ba;--card:#172033;--line:#26324a;--ac:#8fb0ff;--on:#0f1520;color-scheme:dark}
html{height:100%}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.6 Georgia,"Times New Roman",serif}
h1,h2,h3,button,select,input,textarea,label,nav a,.btn{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
h1{font-size:1.9rem;margin:.2em 0}h2{font-size:1.15rem;margin:.2em 0}
a{color:var(--ac)}.mut{color:var(--mut);font-size:.9rem}
header{display:flex;flex-wrap:wrap;gap:.6rem 1rem;align-items:center;justify-content:space-between;padding:.7rem 1rem;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
.logo{font:700 1.1rem system-ui;text-decoration:none;color:var(--fg)}.logo b{color:var(--ac)}.logo{display:inline-flex;align-items:center;gap:.9rem}.lgi{height:40px;width:auto}.lgw{position:relative;display:inline-flex}.lgw::before{content:"";position:absolute;inset:-6px -10px;border-radius:50%;background:#fff;filter:blur(8px);opacity:0;pointer-events:none}.lgw .lgi{position:relative}:root[data-theme="dark"] .lgw::before{opacity:.95}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .lgw::before{opacity:.95}}#st{max-width:92vw;text-align:center;line-height:1.4;padding:.6rem 1.1rem;cursor:pointer}
nav{display:flex;gap:.2rem;flex-wrap:wrap}nav a{padding:.35rem .7rem;border-radius:8px;text-decoration:none;color:var(--fg);font-size:.95rem}
nav a[aria-current=page]{background:var(--ac);color:var(--on)}
.tools{display:flex;gap:.4rem}
main{max-width:860px;margin:0 auto;padding:1rem}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
button,.btn,select,input,textarea{font-size:.95rem;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg);padding:.45rem .7rem}
button,.btn{cursor:pointer;background:var(--ac);color:var(--on);border-color:var(--ac);text-decoration:none;display:inline-block}
button.alt,.tools button{background:var(--card);color:var(--fg);border-color:var(--line)}
button:disabled{opacity:.5;cursor:not-allowed}
textarea{width:100%;min-height:4.5rem;font-family:inherit}
.card,.sel,details{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:1rem;margin:1rem 0}
.hero{padding:1.5rem 0}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.7rem}
.g label{display:flex;flex-direction:column;font-size:.85rem;gap:.2rem;color:var(--mut)}
.bk{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.5rem}
.bk a{padding:.5rem .7rem;border:1px solid var(--line);border-radius:8px;background:var(--card);text-decoration:none;color:var(--fg);font-family:system-ui;font-size:.92rem}
.lab{font:600 1.2rem system-ui;margin:.6rem 0 0}.err{color:#b3261e;min-height:1.2em;margin:.2rem 0}
:root[data-theme="dark"] .err{color:#ffb4ab}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .err{color:#ffb4ab}}
.row{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.5rem}
summary{cursor:pointer}details label{display:block;margin:.8rem 0 .2rem;font-weight:600;font-size:.95rem}
progress{width:100%;height:10px}
dt{font:600 .95rem system-ui;margin-top:.8rem}dd{margin:0;color:var(--mut);font-style:italic}
.item{border-top:1px solid var(--line);padding:.6rem 0}.item:first-child{border-top:0}
.warn{border-left:4px solid var(--ac);padding:.4rem .8rem;background:var(--card)}
#st{position:fixed;bottom:1rem;left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:.4rem 1rem;border-radius:20px;font:.9rem system-ui}
#st:empty{display:none}
footer{text-align:center;padding:2rem 1rem}
html{-webkit-text-size-adjust:100%}html{font-size:calc(100% * var(--fs,1))}body{font-size:clamp(1rem,1.2vw + .75rem,1.19rem);overflow-x:hidden}
main{width:100%;max-width:960px;padding:clamp(.75rem,3vw,2rem)}h1{font-size:clamp(1.5rem,4vw,2.3rem)}
button,.btn,select,input,textarea{min-height:44px;max-width:100%}input[type=checkbox],input[type=radio]{min-height:0;width:1.2rem;height:1.2rem}
nav{overflow-x:auto;flex-wrap:nowrap;-webkit-overflow-scrolling:touch;scrollbar-width:thin}nav a{white-space:nowrap;min-height:44px;display:inline-flex;align-items:center}
.row input[type=search],.row input:not([type]){flex:1 1 200px}svg,img,table{max-width:100%;height:auto}
@media (max-width:640px){header{padding:.5rem .75rem}nav{order:3;width:100%}.row>*{flex:1 1 100%}.g{grid-template-columns:1fr 1fr}.card,.sel,details{padding:.8rem}}
@media (min-width:900px){.g{grid-template-columns:repeat(5,1fr)}.bk{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}}
@media (min-width:1400px){main{max-width:1100px}}
.bn{background:var(--ac);color:var(--on);padding:.6rem 1rem;display:flex;gap:.8rem;align-items:center;justify-content:center;flex-wrap:wrap;font-family:system-ui;text-align:center}.bn button{background:var(--card);color:var(--fg);border-color:var(--card)}
.pray{border-left:4px solid var(--ac);background:var(--card);padding:.6rem .9rem;margin:1rem 0;border-radius:0 8px 8px 0;font:.95rem system-ui}
.lb{background:var(--card);border-bottom:1px solid var(--line);padding:.5rem 1rem;display:flex;gap:.6rem;align-items:center;justify-content:center;flex-wrap:wrap;font:.9rem system-ui;text-align:center}
.big{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1rem;margin:1rem 0}
.big a{display:flex;flex-direction:column;justify-content:center;gap:.3rem;min-height:120px;padding:1.4rem;border-radius:16px;background:var(--ac);color:var(--on);text-decoration:none;font-family:system-ui}
.big b{font-size:1.4rem}.big span{font-size:1rem;opacity:.92}
.chipbox{max-height:12rem;overflow:auto;padding:.1rem;margin:.3rem 0}.cr{display:flex;flex-wrap:wrap;gap:.35rem}.gh{font:600 .8rem system-ui;color:var(--mut);margin:.5rem 0 .25rem}
.chip{display:inline-block;padding:.35rem .7rem;border:1px solid var(--line);border-radius:999px;background:var(--bg);color:var(--fg);text-decoration:none;font:.85rem system-ui;white-space:nowrap}.chip:hover,.chip:focus-visible{border-color:var(--ac);color:var(--ac)}
details>summary{cursor:pointer;padding:.3rem 0}.lkup{margin:.4rem 0 .6rem;padding:.4rem .8rem}
.cat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:.7rem}.cat-card{display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:.4rem;padding:1rem;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:12px}.cat-card span{color:var(--mut);font-size:.88rem;font-weight:400}.cat-card[aria-pressed="true"]{border-color:var(--ac);box-shadow:0 0 0 2px var(--ac)}
.hint{margin:.2rem 0 .5rem;padding-left:1.2rem;color:var(--mut);font-size:.9rem;font-family:system-ui}
.sub{display:flex;gap:.3rem;margin-bottom:1rem;border-bottom:1px solid var(--line);padding-bottom:.6rem;flex-wrap:wrap;overflow:visible}
/* Persistent app navigation */
body{padding-bottom:calc(74px + env(safe-area-inset-bottom,0px))}
header{position:sticky;top:0;z-index:10}
#page-title{font:600 1rem system-ui;color:var(--fg);flex:1;text-align:center}
#nv{position:fixed;z-index:10;bottom:0;left:0;right:0;display:flex;justify-content:space-around;gap:0;padding:.35rem .25rem calc(.35rem + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--line);overflow:visible}
#nv a{flex:1;max-width:120px;min-width:0;min-height:48px;display:flex;justify-content:center;align-items:center;padding:.5rem;border-radius:10px}
#nv svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#st{bottom:calc(80px + env(safe-area-inset-bottom,0px));z-index:11}
@media(max-width:640px){header{gap:.35rem}.logo #lt{display:none}.lgi{height:32px;width:auto}#page-title{font-size:.9rem}.tools{gap:.2rem}.tools button,.tools select{padding:.35rem;min-height:40px;font-size:.8rem}#nv{order:initial;width:auto}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;animation:none!important;transition:none!important}}

const S=[{"n": "Observation|Vëzhgimi", "q": "What does the passage say?|Çfarë thotë pjesa?", "l": [{"id": "o10", "en": "Context before and after", "sq": "Konteksti para dhe pas", "h": {"en": ["What comes right before and right after this passage?", "How does the passage fit into the larger flow of the chapter and the book?"], "sq": ["Çfarë vjen menjëherë para dhe pas kësaj pjese?", "Si përshtatet pjesa në rrjedhën më të gjerë të kapitullit dhe të librit?"]}}, {"id": "o3", "en": "Who is mentioned?", "sq": "Kush përmendet?", "h": {"en": ["Who is speaking, and who is being spoken to?", "Who are the main characters or people groups in the text?", "What actions or traits are assigned to God the Father, Jesus, or the Holy Spirit?", "Are there any hidden or implicit groups present (like ancestors, crowds, spiritual forces, or future believers)?"], "sq": ["Kush flet dhe kujt i drejtohet?", "Cilët janë personazhet kryesorë ose grupet e njerëzve në tekst?", "Çfarë veprimesh ose tiparesh i jepen Zotit Atë, Jezusit ose Frymës së Shenjtë?", "A ka grupe të fshehura ose të nënkuptuara (si stërgjyshër, turma, forca shpirtërore ose besimtarë të ardhshëm)?"]}}, {"id": "o4", "en": "What is mentioned?", "sq": "Çfarë përmendet?", "h": {"en": ["What physical movements or main events are taking place?", "What physical objects, items, or structures (for example bread, altars, swords, clothing) are central to the scene?", "What specific declarations, commands, promises, or statements are made?"], "sq": ["Çfarë lëvizjesh fizike ose ngjarjesh kryesore ndodhin?", "Cilat objekte, sende ose struktura fizike (p.sh. buka, altarët, shpatat, veshja) janë qendrore në skenë?", "Çfarë deklaratash, urdhërimesh, premtimesh ose thëniesh të veçanta bëhen?"]}}, {"id": "o6", "en": "When (time)", "sq": "Kur (koha)", "h": {"en": ["What specific time words are used (for example “after this,” “on the third day,” “at midnight,” “at that hour”)?", "When did this happen historically or in the sequence of the book?", "Are there references to eternal or prophetic time (for example “in the beginning,” “the day of the Lord,” “in these last days”)?"], "sq": ["Cilat fjalë të veçanta kohe përdoren (p.sh. “pas kësaj”, “ditën e tretë”, “në mesnatë”, “në atë orë”)?", "Kur ndodhi kjo historikisht ose në rendin e librit?", "A ka referenca për kohën e përjetshme ose profetike (p.sh. “në fillim”, “dita e Zotit”, “në këto ditë të fundit”)?"]}}, {"id": "o7", "en": "Where (places)", "sq": "Ku (vendet)", "h": {"en": ["What cities, regions, bodies of water, or countries are explicitly named?", "What is the geographic landscape (a mountain, a wilderness, a valley, a sea), and how does it affect the scene?", "What is the immediate physical setting (a temple, a private home, a boat, a prison)?"], "sq": ["Cilat qytete, rajone, ujëra ose vende emërohen shprehimisht?", "Cili është peizazhi gjeografik (mal, shkretëtirë, luginë, det) dhe si e ndikon skenën?", "Cili është mjedisi fizik i menjëhershëm (tempull, shtëpi private, anije, burg)?"]}}, {"id": "o1", "en": "Repeated words or phrases", "sq": "Fjalë ose fraza që përsëriten", "h": {"en": ["What exact words or phrases are repeated?", "Are there synonyms or ideas that keep popping up?", "Does a phrase repeat at the beginning and the end of the section (a literary bookend)?"], "sq": ["Cilat fjalë ose fraza përsëriten saktësisht?", "A ka sinonime ose ide që kthehen vazhdimisht?", "A përsëritet një frazë në fillim dhe në fund të pjesës (një kornizë letrare)?"]}}, {"id": "o2", "en": "Contrasts and comparisons", "sq": "Kontraste dhe krahasime", "h": {"en": ["What opposite ideas are contrasted (look for words like “but,” “however,” “yet,” “instead”)?", "What is being compared using words like “like” or “as”?", "Is there a contrast between a past status and a present reality (for example, “Once you were… but now you are”)?"], "sq": ["Cilat ide të kundërta vihen përballë (kërko fjalë si “por”, “megjithatë”, “akoma”, “në vend të”)?", "Çfarë krahasohet me fjalë si “si” ose “njëlloj si”?", "A ka kontrast mes një gjendjeje të kaluar dhe një realiteti të tanishëm (p.sh. “Dikur ishit… por tani jeni”)?"]}}, {"id": "o13", "en": "Verbs", "sq": "Foljet", "h": {"en": ["What are the primary verbs in the passage?", "Who is doing each action, and to whom or what?", "Are they past, present, or future tense?", "Does the sentence say who performs the action, or who receives it?"], "sq": ["Cilat janë foljet kryesore në pjesë?", "Kush e kryen secilin veprim dhe ndaj kujt ose çfarë kryhet?", "A janë në kohën e shkuar, të tashme apo të ardhme?", "A tregon fjalia kush e kryen veprimin apo kush e pëson atë?"]}}, {"id": "o5", "en": "Quotations and references", "sq": "Citime dhe referenca", "h": {"en": ["Does this text explicitly quote or directly reference an earlier part of the Bible?", "Are there subtle historical hints, catchphrases, or cultural idioms woven into the phrasing?", "Does the author refer back to something they said earlier in this same book or letter?"], "sq": ["A citon ose i referohet drejtpërdrejt ky tekst një pjese më të hershme të Biblës?", "A ka aluzione historike të holla, shprehje të njohura ose idioma kulturore të endura në formulim?", "A i referohet autori diçkaje që ka thënë më herët në të njëjtin libër ose letër?"]}}, {"id": "o8", "en": "Other notable details", "sq": "Detaje të tjera të rëndësishme", "h": {"en": ["What emotional words or exclamation points reveal the mood or state of mind of the writer or speaker?", "Look closely at small connecting words: what are the “therefores,” “so thats,” “becauses,” or “ifs” pointing to?", "Are there specific numbers, sizes, dimensions, or structural frameworks highlighted?"], "sq": ["Cilat fjalë emocionale ose pikëçuditëse zbulojnë gjendjen shpirtërore ose humorin e shkruesit ose folësit?", "Shiko nga afër fjalët e vogla lidhëse: ku drejtojnë “prandaj”, “me qëllim që”, “sepse” ose “nëse”?", "A theksohen numra, përmasa, dimensione ose struktura të veçanta?"]}}, {"id": "o11", "en": "Structure and flow", "sq": "Struktura dhe rrjedha", "h": {"en": ["How can the passage be divided into sections or steps, and what is the main point of each?", "Where does the passage turn, build, or reach its high point?", "How do the verses connect to each other?", "Does one verse give a reason, result, example or contrast for another?", "How do these connections help explain the main point?"], "sq": ["Si mund të ndahet pjesa në seksione ose hapa dhe cila është pika kryesore e secilit?", "Ku kthehet, ndërtohet ose arrin kulmin pjesa?", "Si lidhen vargjet me njëri-tjetrin?", "A jep një varg arsyen, pasojën, shembullin ose kontrastin e një vargu tjetër?", "Si ndihmojnë këto lidhje për të shpjeguar pikën kryesore?"]}}, {"id": "o9", "en": "Main observations and conclusions", "sq": "Vëzhgimet dhe përfundimet kryesore", "h": {"en": ["What are the undeniable, plain facts and landmarks of this exact unit of text, without adding any interpretation?"], "sq": ["Cilat janë faktet dhe pikat e padiskutueshme të kësaj njësie teksti, pa shtuar asnjë interpretim?"]}}, {"id": "o12", "en": "Summary in my own words", "sq": "Përmbledhja me fjalët e mia", "h": {"en": ["In one or two sentences, what is this passage about?", "Can I explain it to someone else without looking at the text?"], "sq": ["Në një ose dy fjali, për çfarë flet kjo pjesë?", "A mund t’ia shpjegoj dikujt tjetër pa parë tekstin?"]}}]}, {"n": "Interpretation|Interpretimi", "q": "What does the passage mean?|Çfarë do të thotë pjesa?", "l": [{"id": "i2", "en": "Original audience", "sq": "Lexuesit origjinalë", "h": {"en": ["What do we know about the original audience and their circumstances?", "Are any historical or cultural customs helpful for understanding the passage?"], "sq": ["Çfarë dimë për lexuesit origjinalë dhe rrethanat e tyre?", "A ka zakone historike ose kulturore që na ndihmojnë ta kuptojmë pjesën?"]}}, {"id": "i4", "en": "Literary genres and devices", "sq": "Zhanre dhe figura letrare", "h": {"en": ["What kind of writing is this—for example, a story, poem, law, prophecy, or letter? How does that affect the way I read it?", "Does the author use imagery, repetition, comparison, or a pattern in the way ideas are arranged?"], "sq": ["Çfarë lloj shkrimi është kjo pjesë—për shembull, tregim, poezi, ligj, profeci apo letër? Si ndikon kjo në mënyrën si e lexoj?", "A përdor autori figura, përsëritje, krahasime ose ndonjë model në renditjen e ideve?"]}}, {"id": "i10", "en": "If it is a story (narrative)", "sq": "Nëse është tregim (narrativë)", "h": {"en": ["Who are the characters, what do they want, and what conflict or problem drives the story?", "How do the characters change, and what does the narrator want us to notice (repeated details, turning points, how the story ends)?", "What does the story show about God, and what does it show about people?"], "sq": ["Kush janë personazhet, çfarë duan dhe çfarë konflikti ose problemi e shtyn tregimin?", "Si ndryshojnë personazhet dhe çfarë dëshiron rrëfyesi të vëmë re (detaje që përsëriten, pika kthese, si përfundon tregimi)?", "Çfarë tregon historia për Perëndinë dhe çfarë tregon për njerëzit?"]}}, {"id": "i11", "en": "If it is poetry or wisdom", "sq": "Nëse është poezi ose urtësi", "h": {"en": ["What images and word pictures are used, and what do they make me feel or understand?", "What is the mood or emotion of the poem, and does it change from beginning to end?", "If it is wisdom, is it a general principle rather than a promise for every case, and what is the lesson?"], "sq": ["Çfarë imazhesh dhe pamjesh me fjalë përdoren dhe çfarë më bëjnë të ndiej ose të kuptoj?", "Cili është humori ose ndjenja e poemës dhe a ndryshon nga fillimi në fund?", "Nëse është urtësi, a është një parim i përgjithshëm dhe jo një premtim për çdo rast, dhe cili është mësimi?"]}}, {"id": "i12", "en": "If it is prophecy or apocalyptic", "sq": "Nëse është profeci ose apokaliptike", "h": {"en": ["Who is the prophecy first addressed to, and what was happening in their time?", "What is promised or warned about, and what is near and what is further ahead?", "What symbols, numbers or visions are used, and how are they explained in the text or elsewhere in Scripture?"], "sq": ["Kujt i drejtohet fillimisht profecia dhe çfarë po ndodhte në kohën e tyre?", "Çfarë premtohet ose paralajmërohet dhe çfarë është afër e çfarë më larg?", "Çfarë simbolesh, numrash ose vizionesh përdoren dhe si shpjegohen në tekst ose gjetkë në Shkrim?"]}}, {"id": "i13", "en": "If it is law or instruction", "sq": "Nëse është ligj ose udhëzim", "h": {"en": ["What does this command say about God’s character and what He values?", "Who was the command given to, and in what situation?", "How does this law fit into the Bible’s larger story, and how does the New Testament relate it to Christ, if relevant?"], "sq": ["Çfarë thotë ky urdhërim për karakterin e Perëndisë dhe për atë që Ai vlerëson?", "Kujt iu dha urdhërimi dhe në çfarë rrethanash?", "Si përshtatet ky ligj në historinë më të gjerë të Biblës dhe, nëse lidhet me të, si e lidh Besëlidhja e Re me Krishtin?"]}}, {"id": "i14", "en": "If it is a letter or teaching", "sq": "Nëse është letër ose mësim", "h": {"en": ["What is the main argument, and how do its steps connect (note “therefore,” “for,” “so that”)?", "What is the author explaining or correcting, and what response is expected?", "Which parts are teaching (what is true) and which are instruction (what to do)?"], "sq": ["Cili është argumenti kryesor dhe si lidhen hapat e tij (vër “prandaj”, “sepse”, “me qëllim që”)?", "Çfarë po shpjegon ose po korrigjon autori dhe çfarë përgjigjeje pritet?", "Cilat pjesë janë mësim (çfarë është e vërtetë) dhe cilat janë udhëzim (çfarë të bëj)?"]}}, {"id": "i15", "en": "If it is a parable or a teaching of Jesus", "sq": "Nëse është shëmbëlltyrë ose mësim i Jezusit", "h": {"en": ["Who is Jesus speaking to, and what question or situation led to this teaching?", "What is the central point of the parable, and which details are just part of the story?", "What response does Jesus call for, and how did the first listeners react?"], "sq": ["Kujt po i flet Jezusi dhe çfarë pyetjeje ose situate çoi te ky mësim?", "Cila është pika qendrore e shëmbëlltyrës dhe cilat detaje janë vetëm pjesë e tregimit?", "Çfarë përgjigjeje kërkon Jezusi dhe si reaguan dëgjuesit e parë?"]}}, {"id": "i5", "en": "Words and phrases needing definition", "sq": "Fjalë dhe fraza që kërkojnë përkufizim", "h": {"en": ["Are there words or phrases I don’t understand? What does the surrounding passage suggest they mean?", "Would comparing translations or using a trusted Bible dictionary, commentary, or language tool help clarify them?", "Could a word or phrase have meant something different in its original language or ancient setting? If so, what do reliable resources say?"], "sq": ["A ka fjalë ose fraza që nuk i kuptoj? Çfarë sugjeron pjesa përreth për kuptimin e tyre?", "A do të ndihmonte krahasimi i përkthimeve ose përdorimi i një fjalori biblik, komentari apo mjeti gjuhësor të besueshëm për t’i sqaruar?", "A mund të ketë pasur një fjalë ose frazë një kuptim tjetër në gjuhën origjinale ose në kontekstin e saj të lashtë? Nëse po, çfarë thonë burimet e besueshme?"]}}, {"id": "i3", "en": "Key words and themes", "sq": "Fjalë dhe tema kyç", "h": {"en": ["What major theological terms (for example covenant, grace, justification, holiness) drive this text?", "What is the single “big idea” or core theme anchoring this text?"], "sq": ["Cilat terma të mëdhenj teologjikë (p.sh. besëlidhje, hir, shfajësim, shenjtëri) e shtyjnë përpara këtë tekst?", "Cila është “ideja e madhe” e vetme ose tema qendrore që e ankoron këtë tekst?"]}}, {"id": "i8", "en": "Primary message to the original readers", "sq": "Mesazhi kryesor për lexuesit origjinalë", "h": {"en": ["What was the core takeaway the original readers were supposed to understand, believe, or change upon hearing these words for the very first time?"], "sq": ["Cili ishte mësimi kryesor që lexuesit origjinalë duhej të kuptonin, të besonin ose të ndryshonin kur i dëgjuan këto fjalë për herë të parë?"]}}, {"id": "i1", "en": "The author’s intended message and purpose", "sq": "Mesazhi dhe qëllimi i autorit", "h": {"en": ["How does this section contribute to the main message or purpose of the whole book?"], "sq": ["Si ndihmon kjo pjesë për të shprehur mesazhin ose qëllimin kryesor të gjithë librit?"]}}, {"id": "i9", "en": "What it teaches about God and people", "sq": "Çfarë mëson për Perëndinë dhe njerëzit", "h": {"en": ["What does this passage reveal about God’s character and actions?", "What does it reveal about people, sin, and salvation?"], "sq": ["Çfarë zbulon kjo pjesë për karakterin dhe veprimet e Perëndisë?", "Çfarë zbulon për njerëzit, mëkatin dhe shpëtimin?"]}}, {"id": "i6", "en": "Difficult sayings and questions", "sq": "Thënie dhe pyetje të vështira", "h": {"en": ["What statements in this passage seem confusing, harsh, or contradictory to other parts of Scripture at first?", "What puzzles or unanswered questions arise that need deeper prayer, study, and reference tools to unpack carefully?"], "sq": ["Cilat thënie në këtë pjesë duken në fillim të ngatërruara, të ashpra ose në kundërshtim me pjesë të tjera të Shkrimit?", "Çfarë enigmash ose pyetjesh pa përgjigje dalin që kërkojnë lutje, studim dhe mjete referimi më të thella për t’u shpjeguar me kujdes?"]}}, {"id": "i7", "en": "Cross-references and broader context", "sq": "Referenca të tjera dhe konteksti më i gjerë", "h": {"en": ["How do other passages in the Bible clarify or expand on what is being said here?", "Where does this passage fit in the Bible’s larger story? How might it relate to God’s promises and to Christ?"], "sq": ["Si e sqarojnë ose e zgjerojnë pasazhe të tjera të Biblës atë që thuhet këtu?", "Ku përshtatet kjo pjesë në historinë më të gjerë të Biblës? Si mund të lidhet me premtimet e Perëndisë dhe me Krishtin?"]}}, {"id": "i16", "en": "Questions I still have", "sq": "Pyetjet që kam ende", "h": {"en": ["What do I still not understand about this passage?", "What could I ask a pastor or teacher, or look up in a Bible dictionary or commentary?"], "sq": ["Çfarë ende nuk e kuptoj për këtë pjesë?", "Çfarë mund t’i pyes një pastori ose mësuesi, ose të kërkoj në një fjalor biblik ose koment?"]}}]}, {"n": "Application|Zbatimi", "q": "How does it apply to me?|Si zbatohet për mua?", "l": [{"id": "a7", "en": "Truths about identity in Christ", "sq": "Të vërteta për identitetin në Krisht", "h": {"en": ["Does this passage say anything about who believers are in Christ? If so, what does it teach?", "How might that truth affect the way I see myself and live?"], "sq": ["A thotë kjo pjesë diçka për atë se kush janë besimtarët në Krishtin? Nëse po, çfarë mëson?", "Si mund të ndikojë kjo e vërtetë në mënyrën si e shoh veten dhe si jetoj?"]}}, {"id": "a1", "en": "Commands to obey", "sq": "Urdhërime për t’u zbatuar", "h": {"en": ["Are there instructions in this passage? Who were they given to, and how should I respond?", "If a command is given, what reason or motivation does the passage give for it?"], "sq": ["A ka udhëzime në këtë pjesë? Kujt iu dhanë dhe si duhet të përgjigjem?", "Nëse jepet një urdhërim, çfarë arsyeje ose motivimi jep pjesa për të?"]}}, {"id": "a2", "en": "Promises to believe", "sq": "Premtime për t’u besuar", "h": {"en": ["Does the passage contain a promise or assurance? To whom is it given?", "If so, is it connected to a particular condition or situation, and how should I respond today?"], "sq": ["A përmban pjesa ndonjë premtim ose siguri? Kujt i jepet?", "Nëse po, a lidhet me një kusht ose rrethanë të caktuar dhe si duhet të përgjigjem sot?"]}}, {"id": "a3", "en": "Warnings to heed", "sq": "Paralajmërime për t’u marrë parasysh", "h": {"en": ["Does the passage contain a warning? What does it warn against?", "If so, how should I respond to that warning?"], "sq": ["A përmban pjesa ndonjë paralajmërim? Kundër çfarë na paralajmëron?", "Nëse po, si duhet t’i përgjigjem atij paralajmërimi?"]}}, {"id": "a5", "en": "Repentance and reproof", "sq": "Pendim dhe qortim", "h": {"en": ["Does this passage reveal any sin or wrong attitude I need to confess and turn away from?"], "sq": ["A zbulon kjo pjesë ndonjë mëkat ose qëndrim të gabuar që duhet ta rrëfej dhe prej të cilit duhet të largohem?"]}}, {"id": "a6", "en": "Correction and training in righteousness", "sq": "Korrigjim dhe stërvitje në drejtësi", "h": {"en": ["Does this passage challenge a belief or habit of mine, or encourage a practice I can grow in?"], "sq": ["A sfidon kjo pjesë ndonjë bindje ose zakon timin, apo më nxit të zhvilloj ndonjë praktikë të mirë?"]}}, {"id": "a8", "en": "Christlike characteristics to emulate", "sq": "Karakteristika të ngjashme me Krishtin", "h": {"en": ["What specific traits, fruit of the Spirit, virtues, or patterns of love, humility, and submission shown by Christ (or godly examples) am I called to mirror?"], "sq": ["Cilat tipare të veçanta, fryte të Frymës, virtyte ose modele dashurie, përulësie dhe nënshtrimi të treguara nga Krishti (ose nga shembuj të devotshëm) jam i thirrur t’i pasqyroj?"]}}, {"id": "a4", "en": "Reasons to give thanks or rejoice", "sq": "Arsye për falënderim dhe gëzim", "h": {"en": ["What aspects of God’s holiness, mercy, sovereignty, or work in salvation are revealed that call for praise and thanksgiving?", "What has God done for me in this text that I could never achieve on my own?"], "sq": ["Cilët aspekte të shenjtërisë, mëshirës, sovranitetit ose veprës së Perëndisë në shpëtim zbulohen që kërkojnë lavdërim dhe falënderim?", "Çfarë ka bërë Perëndia për mua në këtë tekst që nuk do ta arrija kurrë vetë?"]}}, {"id": "a9", "en": "Practical responses and next steps", "sq": "Përgjigje praktike dhe hapat e radhës", "h": {"en": ["What is one practical step I can take in response to what I have learned?", "How might this truth affect the way I treat others?"], "sq": ["Cili është një hap praktik që mund të bëj si përgjigje ndaj asaj që kam mësuar?", "Si mund të ndikojë kjo e vërtetë në mënyrën si i trajtoj të tjerët?"]}}, {"id": "a11", "en": "Prayer in response", "sq": "Lutja si përgjigje", "h": {"en": ["What do I want to say to God in response to this passage: praise, confession, thanks, or a request?", "Who could I pray for, or share this truth with?"], "sq": ["Çfarë dua t’i them Perëndisë në përgjigje të kësaj pjese: lavdërim, rrëfim, falënderim apo një kërkesë?", "Për kë mund të lutem ose me kë mund ta ndaj këtë të vërtetë?"]}}, {"id": "a10", "en": "Final conclusion", "sq": "Përfundimi", "h": {"en": ["What have I learned, and how do I want to respond to God?"], "sq": ["Çfarë kam mësuar dhe si dua t’i përgjigjem Perëndisë?"]}}]}];
const pray=k=>`<div class="pray"><strong>${t("pray")}</strong> ${t(k)}</div>`;
const hn=q=>{const h=q.h&&(q.h[lang]||q.h.en);return h&&h.length?`<ul class="hint">${h.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:""};
const FK="author,date,background,setting,audience,purpose,hthemes,tthemes,structure,outline,challenges,locations,resources,refs,notes".split(",");const FIELDS="Author and authorship|Autori dhe autorësia;Date of composition|Koha e shkrimit;Historical background|Konteksti historik;Historical setting|Rrethanat historike;Original audience|Lexuesit origjinalë;Purpose of writing|Qëllimi i shkrimit;Historical themes|Tema historike;Theological themes|Tema teologjike;Literary structure and genre|Struktura letrare dhe zhanri;Outline|Skema;Interpretive challenges|Sfida interpretimi;Important locations|Vende të rëndësishme;Related resources|Burime të lidhura;Related references|Referenca të lidhura;Additional notes|Shënime shtesë".split(";").map((x,i)=>{const[en,sq]=x.split("|");return{en,sq,k:FK[i]}});
