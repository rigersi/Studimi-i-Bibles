<style>
:root{--bg:#f6f8fb;--fg:#1c2430;--mut:#5b6675;--card:#fff;--line:#dde3ec;--ac:#1e3a6e;--on:#fff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1520;--fg:#e8edf5;--mut:#9aa7ba;--card:#172033;--line:#26324a;--ac:#8fb0ff;--on:#0f1520;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1520;--fg:#e8edf5;--mut:#9aa7ba;--card:#172033;--line:#26324a;--ac:#8fb0ff;--on:#0f1520;color-scheme:dark}
html{height:100%}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.6 Georgia,"Times New Roman",serif}
h1,h2,h3,button,select,input,textarea,label,nav a,.btn{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
h1{font-size:1.9rem;margin:.2em 0}h2{font-size:1.15rem;margin:.2em 0}
a{color:var(--ac)}.mut{color:var(--mut);font-size:.9rem}
header{display:flex;flex-wrap:wrap;gap:.6rem 1rem;align-items:center;justify-content:space-between;padding:.7rem 1rem;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
.logo{font:700 1.1rem system-ui;text-decoration:none;color:var(--fg)}.logo b{color:var(--ac)}
nav{display:flex;gap:.2rem;flex-wrap:wrap}nav a{padding:.35rem .7rem;border-radius:8px;text-decoration:none;color:var(--fg);font-size:.95rem}
nav a[aria-current=page]{background:var(--ac);color:var(--on)}
.tools{display:flex;gap:.4rem}
main{max-width:860px;margin:0 auto;padding:1rem}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
button,.btn,select,input,textarea{font-size:.95rem;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg);padding:.45rem .7rem}
button,.btn{cursor:pointer;background:var(--ac);color:var(--on);border-color:var(--ac);text-decoration:none;display:inline-block}
button.alt,.tools button{background:var(--card);color:var(--fg);border-color:var(--line)}
button:disabled{opacity:.5;cursor:not-allowed}
textarea{width:100%;min-height:4.5rem;font-family:inherit}
.card,.sel,details{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:1rem;margin:1rem 0}
.hero{padding:1.5rem 0}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.7rem}
.g label{display:flex;flex-direction:column;font-size:.85rem;gap:.2rem;color:var(--mut)}
.bk{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.5rem}
.bk a{padding:.5rem .7rem;border:1px solid var(--line);border-radius:8px;background:var(--card);text-decoration:none;color:var(--fg);font-family:system-ui;font-size:.92rem}
.lab{font:600 1.2rem system-ui;margin:.6rem 0 0}.err{color:#b3261e;min-height:1.2em;margin:.2rem 0}
:root[data-theme="dark"] .err{color:#ffb4ab}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .err{color:#ffb4ab}}
.row{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.5rem}
summary{cursor:pointer}details label{display:block;margin:.8rem 0 .2rem;font-weight:600;font-size:.95rem}
progress{width:100%;height:10px}
dt{font:600 .95rem system-ui;margin-top:.8rem}dd{margin:0;color:var(--mut);font-style:italic}
.item{border-top:1px solid var(--line);padding:.6rem 0}.item:first-child{border-top:0}
.warn{border-left:4px solid var(--ac);padding:.4rem .8rem;background:var(--card)}
#st{position:fixed;bottom:1rem;left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:.4rem 1rem;border-radius:20px;font:.9rem system-ui}
#st:empty{display:none}
footer{text-align:center;padding:2rem 1rem}
html{-webkit-text-size-adjust:100%}html{font-size:calc(100% * var(--fs,1))}body{font-size:clamp(1rem,1.2vw + .75rem,1.19rem);overflow-x:hidden}
main{width:100%;max-width:960px;padding:clamp(.75rem,3vw,2rem)}h1{font-size:clamp(1.5rem,4vw,2.3rem)}
button,.btn,select,input,textarea{min-height:44px;max-width:100%}input[type=checkbox],input[type=radio]{min-height:0;width:1.2rem;height:1.2rem}
nav{overflow-x:auto;flex-wrap:nowrap;-webkit-overflow-scrolling:touch;scrollbar-width:thin}nav a{white-space:nowrap;min-height:44px;display:inline-flex;align-items:center}
.row input[type=search],.row input:not([type]){flex:1 1 200px}svg,img,table{max-width:100%;height:auto}
@media (max-width:640px){header{padding:.5rem .75rem}nav{order:3;width:100%}.row>*{flex:1 1 100%}.g{grid-template-columns:1fr 1fr}.card,.sel,details{padding:.8rem}}
@media (min-width:900px){.g{grid-template-columns:repeat(5,1fr)}.bk{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}}
@media (min-width:1400px){main{max-width:1100px}}
.bn{background:var(--ac);color:var(--on);padding:.6rem 1rem;display:flex;gap:.8rem;align-items:center;justify-content:center;flex-wrap:wrap;font-family:system-ui;text-align:center}.bn button{background:var(--card);color:var(--fg);border-color:var(--card)}
.big{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1rem;margin:1rem 0}
.big a{display:flex;flex-direction:column;justify-content:center;gap:.3rem;min-height:120px;padding:1.4rem;border-radius:16px;background:var(--ac);color:var(--on);text-decoration:none;font-family:system-ui}
.big b{font-size:1.4rem}.big span{font-size:1rem;opacity:.92}
.hint{margin:.2rem 0 .5rem;padding-left:1.2rem;color:var(--mut);font-size:.9rem;font-family:system-ui}
.sub{display:flex;gap:.3rem;margin-bottom:1rem;border-bottom:1px solid var(--line);padding-bottom:.6rem;flex-wrap:wrap;overflow:visible}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;animation:none!important;transition:none!important}}
</style></head>

<script>
"use strict";
/* ---------- Reference metadata (NO Bible text). id|English|Albanian|chapters. Albanian names: please verify against your preferred translation. ---------- */
const B="Gen|Genesis|Zanafilla|50;Exod|Exodus|Eksodi|40;Lev|Leviticus|Levitiku|27;Num|Numbers|Numrat|36;Deut|Deuteronomy|Ligji i Përtërirë|34;Josh|Joshua|Jozueu|24;Judg|Judges|Gjyqtarët|21;Ruth|Ruth|Rutha|4;1Sam|1 Samuel|1 Samueli|31;2Sam|2 Samuel|2 Samueli|24;1Kgs|1 Kings|1 Mbretërve|22;2Kgs|2 Kings|2 Mbretërve|25;1Chr|1 Chronicles|1 Kronikave|29;2Chr|2 Chronicles|2 Kronikave|36;Ezra|Ezra|Esdra|10;Neh|Nehemiah|Nehemia|13;Esth|Esther|Estera|10;Job|Job|Jobi|42;Ps|Psalms|Psalmet|150;Prov|Proverbs|Fjalët e urta|31;Eccl|Ecclesiastes|Eklisiastiu|12;Song|Song of Solomon|Kënga e Këngëve|8;Isa|Isaiah|Isaia|66;Jer|Jeremiah|Jeremia|52;Lam|Lamentations|Vajtimet|5;Ezek|Ezekiel|Ezekieli|48;Dan|Daniel|Danieli|12;Hos|Hosea|Osea|14;Joel|Joel|Joeli|3;Amos|Amos|Amosi|9;Obad|Obadiah|Abdia|1;Jonah|Jonah|Jona|4;Mic|Micah|Mikea|7;Nah|Nahum|Nahumi|3;Hab|Habakkuk|Habakuku|3;Zeph|Zephaniah|Sofonia|3;Hag|Haggai|Hagai|2;Zech|Zechariah|Zakaria|14;Mal|Malachi|Malakia|4;Matt|Matthew|Mateu|28;Mark|Mark|Marku|16;Luke|Luke|Luka|24;John|John|Gjoni|21;Acts|Acts|Veprat e Apostujve|28;Rom|Romans|Romakëve|16;1Cor|1 Corinthians|1 Korintasve|16;2Cor|2 Corinthians|2 Korintasve|13;Gal|Galatians|Galatasve|6;Eph|Ephesians|Efesianëve|6;Phil|Philippians|Filipianëve|4;Col|Colossians|Kolosianëve|4;1Thess|1 Thessalonians|1 Selanikasve|5;2Thess|2 Thessalonians|2 Selanikasve|3;1Tim|1 Timothy|1 Timoteut|6;2Tim|2 Timothy|2 Timoteut|4;Titus|Titus|Titit|3;Phlm|Philemon|Filemonit|1;Heb|Hebrews|Hebrenjve|13;Jas|James|Jakobi|5;1Pet|1 Peter|1 Pjetrit|5;2Pet|2 Peter|2 Pjetrit|3;1John|1 John|1 Gjonit|5;2John|2 John|2 Gjonit|1;3John|3 John|3 Gjonit|1;Jude|Jude|Juda|1;Rev|Revelation|Zbulesa|22".split(";").map((s,i)=>{const[id,en,sq,c]=s.split("|");return{id,en,sq,ch:+c,nt:i>=39}});
const bk=id=>B.find(b=>b.id===id)||B[0];
/* ---------- Study structure (editable data; en|sq titles). Prompts are structural categories only, no answers. ---------- */
const S=[{"n": "Observation|Vëzhgimi", "q": "What does the passage say?|Çfarë thotë pjesa?", "l": [{"id": "o10", "en": "Context before and after", "sq": "Konteksti para dhe pas", "h": {"en": ["What comes right before and right after this passage?", "How does the passage fit into the larger flow of the chapter and the book?"], "sq": ["Çfarë vjen menjëherë para dhe pas kësaj pjese?", "Si përshtatet pjesa në rrjedhën më të gjerë të kapitullit dhe të librit?"]}}, {"id": "o1", "en": "Repeated words or phrases", "sq": "Fjalë ose fraza që përsëriten", "h": {"en": ["What exact words or phrases are repeated?", "Are there synonyms or ideas that keep popping up?", "Does a phrase repeat at the beginning and the end of the section (a literary bookend)?"], "sq": ["Cilat fjalë ose fraza përsëriten saktësisht?", "A ka sinonime ose ide që kthehen vazhdimisht?", "A përsëritet një frazë në fillim dhe në fund të pjesës (një kornizë letrare)?"]}}, {"id": "o2", "en": "Contrasts and comparisons", "sq": "Kontraste dhe krahasime", "h": {"en": ["What opposite ideas are contrasted (look for words like “but,” “however,” “yet,” “instead”)?", "What is being compared using words like “like” or “as”?", "Is there a contrast between a past status and a present reality (for example, “Once you were… but now you are”)?"], "sq": ["Cilat ide të kundërta vihen përballë (kërko fjalë si “por”, “megjithatë”, “akoma”, “në vend të”)?", "Çfarë krahasohet me fjalë si “si” ose “njëlloj si”?", "A ka kontrast mes një gjendjeje të kaluar dhe një realiteti të tanishëm (p.sh. “Dikur ishit… por tani jeni”)?"]}}, {"id": "o3", "en": "Who is mentioned?", "sq": "Kush përmendet?", "h": {"en": ["Who is speaking, and who is being spoken to?", "Who are the main characters or people groups in the text?", "What actions or traits are assigned to God the Father, Jesus, or the Holy Spirit?", "Are there any hidden or implicit groups present (like ancestors, crowds, spiritual forces, or future believers)?"], "sq": ["Kush flet dhe kujt i drejtohet?", "Cilët janë personazhet kryesorë ose grupet e njerëzve në tekst?", "Çfarë veprimesh ose tiparesh i jepen Zotit Atë, Jezusit ose Frymës së Shenjtë?", "A ka grupe të fshehura ose të nënkuptuara (si stërgjyshër, turma, forca shpirtërore ose besimtarë të ardhshëm)?"]}}, {"id": "o4", "en": "What is mentioned?", "sq": "Çfarë përmendet?", "h": {"en": ["What physical movements or main events are taking place?", "What physical objects, items, or structures (for example bread, altars, swords, clothing) are central to the scene?", "What specific declarations, commands, promises, or statements are made?"], "sq": ["Çfarë lëvizjesh fizike ose ngjarjesh kryesore ndodhin?", "Cilat objekte, sende ose struktura fizike (p.sh. buka, altarët, shpatat, veshja) janë qendrore në skenë?", "Çfarë deklaratash, urdhërimesh, premtimesh ose thëniesh të veçanta bëhen?"]}}, {"id": "o13", "en": "Verbs", "sq": "Foljet", "h": {"en": ["What are the primary verbs in the passage?", "Are they past, present, or future tense?", "Are they actions we must take (active) or things God has already done for us (passive)?"], "sq": ["Cilat janë foljet kryesore në pjesë?", "A janë në kohën e shkuar, të tashme apo të ardhme?", "A janë veprime që duhet t’i bëjmë ne (veprore) apo gjëra që Perëndia i ka bërë tashmë për ne (pësore)?"]}}, {"id": "o5", "en": "Quotations and references", "sq": "Citime dhe referenca", "h": {"en": ["Does this text explicitly quote or directly reference an earlier part of the Bible?", "Are there subtle historical hints, catchphrases, or cultural idioms woven into the phrasing?", "Does the author refer back to something they said earlier in this same book or letter?"], "sq": ["A citon ose i referohet drejtpërdrejt ky tekst një pjese më të hershme të Biblës?", "A ka aluzione historike të holla, shprehje të njohura ose idioma kulturore të endura në formulim?", "A i referohet autori diçkaje që ka thënë më herët në të njëjtin libër ose letër?"]}}, {"id": "o6", "en": "When (time)", "sq": "Kur (koha)", "h": {"en": ["What specific time words are used (for example “after this,” “on the third day,” “at midnight,” “at that hour”)?", "When did this happen historically or in the sequence of the book?", "Are there references to eternal or prophetic time (for example “in the beginning,” “the day of the Lord,” “in these last days”)?"], "sq": ["Cilat fjalë të veçanta kohe përdoren (p.sh. “pas kësaj”, “ditën e tretë”, “në mesnatë”, “në atë orë”)?", "Kur ndodhi kjo historikisht ose në rendin e librit?", "A ka referenca për kohën e përjetshme ose profetike (p.sh. “në fillim”, “dita e Zotit”, “në këto ditë të fundit”)?"]}}, {"id": "o7", "en": "Where (places)", "sq": "Ku (vendet)", "h": {"en": ["What cities, regions, bodies of water, or countries are explicitly named?", "What is the geographic landscape (a mountain, a wilderness, a valley, a sea), and how does it affect the scene?", "What is the immediate physical setting (a temple, a private home, a boat, a prison)?"], "sq": ["Cilat qytete, rajone, ujëra ose vende emërohen shprehimisht?", "Cili është peizazhi gjeografik (mal, shkretëtirë, luginë, det) dhe si e ndikon skenën?", "Cili është mjedisi fizik i menjëhershëm (tempull, shtëpi private, anije, burg)?"]}}, {"id": "o8", "en": "Other notable details", "sq": "Detaje të tjera të rëndësishme", "h": {"en": ["What emotional words or exclamation points reveal the mood or state of mind of the writer or speaker?", "Look closely at small connecting words: what are the “therefores,” “so thats,” “becauses,” or “ifs” pointing to?", "Are there specific numbers, sizes, dimensions, or structural frameworks highlighted?"], "sq": ["Cilat fjalë emocionale ose pikëçuditëse zbulojnë gjendjen shpirtërore ose humorin e shkruesit ose folësit?", "Shiko nga afër fjalët e vogla lidhëse: ku drejtojnë “prandaj”, “me qëllim që”, “sepse” ose “nëse”?", "A theksohen numra, përmasa, dimensione ose struktura të veçanta?"]}}, {"id": "o11", "en": "Structure and flow", "sq": "Struktura dhe rrjedha", "h": {"en": ["How can the passage be divided into sections or steps, and what is the main point of each?", "Where does the passage turn, build, or reach its high point?"], "sq": ["Si mund të ndahet pjesa në seksione ose hapa dhe cila është pika kryesore e secilit?", "Ku kthehet, ndërtohet ose arrin kulmin pjesa?"]}}, {"id": "o12", "en": "Summary in my own words", "sq": "Përmbledhja me fjalët e mia", "h": {"en": ["In one or two sentences, what is this passage about?", "Can I explain it to someone else without looking at the text?"], "sq": ["Në një ose dy fjali, për çfarë flet kjo pjesë?", "A mund t’ia shpjegoj dikujt tjetër pa parë tekstin?"]}}, {"id": "o9", "en": "Main observations and conclusions", "sq": "Vëzhgimet dhe përfundimet kryesore", "h": {"en": ["What are the undeniable, plain facts and landmarks of this exact unit of text, without adding any interpretation?"], "sq": ["Cilat janë faktet dhe pikat e padiskutueshme të kësaj njësie teksti, pa shtuar asnjë interpretim?"]}}]}, {"n": "Interpretation|Interpretimi", "q": "What does the passage mean?|Çfarë do të thotë pjesa?", "l": [{"id": "i1", "en": "The author’s intended message and purpose", "sq": "Mesazhi dhe qëllimi i autorit", "h": {"en": ["Why did the author write this specific segment to their original readers? What shift were they trying to provoke?", "How does this section help build the main message, argument, climax, or theological goal of the entire book?"], "sq": ["Pse e shkroi autori pikërisht këtë segment për lexuesit e tij të parë? Çfarë ndryshimi donte të sillte?", "Si ndihmon kjo pjesë në ndërtimin e mesazhit kryesor, argumentit, kulmit ose qëllimit teologjik të të gjithë librit?"]}}, {"id": "i2", "en": "Original audience", "sq": "Lexuesit origjinalë", "h": {"en": ["What specific problem, trial, crisis, persecution, false teaching, or everyday situation was the original audience going through?", "What ancient Near Eastern or Greco-Roman customs, legal protocols, or social hierarchies form the background of their daily lives?"], "sq": ["Çfarë problemi, sprove, krize, përndjekjeje, mësimi të rremë ose situate të përditshme po kalonte audienca origjinale?", "Cilat zakone të Lindjes së Afërt të lashtë ose greko-romake, protokolle ligjore ose hierarki shoqërore përbëjnë sfondin e jetës së tyre të përditshme?"]}}, {"id": "i3", "en": "Key words and themes", "sq": "Fjalë dhe tema kyç", "h": {"en": ["What major theological terms (for example covenant, grace, justification, holiness) drive this text?", "What is the single “big idea” or core theme anchoring this text?"], "sq": ["Cilat terma të mëdhenj teologjikë (p.sh. besëlidhje, hir, shfajësim, shenjtëri) e shtyjnë përpara këtë tekst?", "Cila është “ideja e madhe” e vetme ose tema qendrore që e ankoron këtë tekst?"]}}, {"id": "i4", "en": "Literary genres and devices", "sq": "Zhanre dhe figura letrare", "h": {"en": ["Is this passage Law, Old Testament narrative, Hebrew poetry, Wisdom, Prophecy, a Gospel story, a Parable, a Letter, or Apocalyptic literature? What rules govern how we interpret this style?", "Is the author using hyperbole, irony, rhetorical questions, poetic patterns (like synonymous, antithetic, or synthetic parallelism), or a chiastic (symmetrical) framework?"], "sq": ["A është kjo pjesë Ligj, tregim i Besëlidhjes së Vjetër, poezi hebraike, Urtësi, Profeci, tregim ungjillor, Shëmbëlltyrë, Letër ose letërsi apokaliptike? Cilat rregulla udhëheqin mënyrën si e interpretojmë këtë stil?", "A përdor autori hiperbolë, ironi, pyetje retorike, modele poetike (si paralelizëm sinonimik, antitetik ose sintetik) ose një strukturë kiastike (simetrike)?"]}}, {"id": "i10", "en": "If it is a story (narrative)", "sq": "Nëse është tregim (narrativë)", "h": {"en": ["Who are the characters, what do they want, and what conflict or problem drives the story?", "How do the characters change, and what does the narrator want us to notice (repeated details, turning points, how the story ends)?", "What does the story show about God, and what does it show about people?"], "sq": ["Kush janë personazhet, çfarë duan dhe çfarë konflikti ose problemi e shtyn tregimin?", "Si ndryshojnë personazhet dhe çfarë dëshiron rrëfyesi të vëmë re (detaje që përsëriten, pika kthese, si përfundon tregimi)?", "Çfarë tregon historia për Perëndinë dhe çfarë tregon për njerëzit?"]}}, {"id": "i11", "en": "If it is poetry or wisdom", "sq": "Nëse është poezi ose urtësi", "h": {"en": ["What images and word pictures are used, and what do they make me feel or understand?", "What is the mood or emotion of the poem, and does it change from beginning to end?", "If it is wisdom, is it a general principle rather than a promise for every case, and what is the lesson?"], "sq": ["Çfarë imazhesh dhe pamjesh me fjalë përdoren dhe çfarë më bëjnë të ndiej ose të kuptoj?", "Cili është humori ose ndjenja e poemës dhe a ndryshon nga fillimi në fund?", "Nëse është urtësi, a është një parim i përgjithshëm dhe jo një premtim për çdo rast, dhe cili është mësimi?"]}}, {"id": "i12", "en": "If it is prophecy or apocalyptic", "sq": "Nëse është profeci ose apokaliptike", "h": {"en": ["Who is the prophecy first addressed to, and what was happening in their time?", "What is promised or warned about, and what is near and what is further ahead?", "What symbols, numbers or visions are used, and how are they explained in the text or elsewhere in Scripture?"], "sq": ["Kujt i drejtohet fillimisht profecia dhe çfarë po ndodhte në kohën e tyre?", "Çfarë premtohet ose paralajmërohet dhe çfarë është afër e çfarë më larg?", "Çfarë simbolesh, numrash ose vizionesh përdoren dhe si shpjegohen në tekst ose gjetkë në Shkrim?"]}}, {"id": "i13", "en": "If it is law or instruction", "sq": "Nëse është ligj ose udhëzim", "h": {"en": ["What does this command say about God’s character and about what He values?", "Who was the command given to, and in what situation (covenant, worship, daily life, justice)?", "How does this law point to Christ, and how does t ent in their ancient context than in ours (for example “gird up the loins of your mind”)?"], "sq": ["Cilat fjalë ose fraza të veçanta duhet të përkufizohen me një fjalor biblik, leksikon ose konkordancë për të kuptuar plotësisht kuptimin e tyre origjinal?", "Çfarë nënkuptonin fjalët në gjuhën origjinale (hebraisht, aramaisht, greqisht) për shkruesin atëherë, pavarësisht fjalorëve ose traditave moderne?", "Cilat fraza kanë një kuptim krejt tjetër në kontekstin e tyre të lashtë nga ai i sotmi (p.sh. “mbështillni ijët e mendjes suaj”)?"]}}, {"id": "i6", "en": "Difficult sayings and questions", "sq": "Thënie dhe pyetje të vështira", "h": {"en": ["What statements in this passage seem confusing, harsh, or contradictory to other parts of Scripture at first?", "What puzzles or unanswered questions arise that need deeper prayer, study, and reference tools to unpack carefully?"], "sq": ["Cilat thënie në këtë pjesë duken në fillim të ngatërruara, të ashpra ose në kundërshtim me pjesë të tjera të Shkrimit?", "Çfarë enigmash ose pyetjesh pa përgjigje dalin që kërkojnë lutje, studim dhe mjete referimi më të thella për t’u shpjeguar me kujdes?"]}}, {"id": "i9", "en": "What it teaches about God and people", "sq": "Çfarë mëson për Perëndinë dhe njerëzit", "h": {"en": ["What does this passage reveal about God’s character and actions?", "What does it reveal about people, sin, and salvation?"], "sq": ["Çfarë zbulon kjo pjesë për karakterin dhe veprimet e Perëndisë?", "Çfarë zbulon për njerëzit, mëkatin dhe shpëtimin?"]}}, {"id": "i7", "en": "Cross-references and broader context", "sq": "Referenca të tjera dhe konteksti më i gjerë", "h": {"en": ["How do other passages in the Bible clear up, expand on, or illuminate what is being said here?", "Where does this passage sit on the timeline of God’s unfolding covenants (Noahic, Abrahamic, Mosaic, Davidic, New), and how does it point to Christ?"], "sq": ["Si e sqarojnë, e zgjerojnë ose e ndriçojnë pasazhe të tjera të Biblës atë që thuhet këtu
